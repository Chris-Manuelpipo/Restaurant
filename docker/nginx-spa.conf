# Application à page unique : toute route inconnue rend index.html, le routeur
# du navigateur fait le reste. Les fichiers versionnés se mettent en cache pour
# un an ; index.html et le service worker, jamais — sinon un déploiement resterait
# invisible pour les clients déjà venus.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location ~* \.(js|css|woff2|png|jpg|jpeg|webp|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
